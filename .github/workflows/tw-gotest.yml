name: tw-gotest
on:
  push:
    branches: ['tw-ci/**']
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: devshard/go.mod
          cache: true
          cache-dependency-path: devshard/go.sum
      - name: go test devshard ./cmd/gateway/... -race -count=3 -cpu=1,4,16 -shuffle=on -timeout 38m
        if: always()
        working-directory: devshard
        run: go test ./cmd/gateway/... -race -count=3 -cpu=1,4,16 -shuffle=on -timeout 38m 2>&1 | tail -n 300
        shell: bash -o pipefail {0}
