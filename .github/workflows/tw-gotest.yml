name: tw-gotest
on:
  push:
    branches: ['tw-ci/**']
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: decentralized-api/go.mod
          cache: true
          cache-dependency-path: decentralized-api/go.sum
      - name: go test decentralized-api ./broker/ -race -count=2 -cpu=1,8 -shuffle=1795500468085270208 -v -timeout 20m
        if: always()
        working-directory: decentralized-api
        run: go test ./broker/ -race -count=2 -cpu=1,8 -shuffle=1795500468085270208 -v -timeout 20m 2>&1
        shell: bash -o pipefail {0}
      - name: go test decentralized-api ./broker/ -race -count=6 -shuffle=on -timeout 15m
        if: always()
        working-directory: decentralized-api
        run: go test ./broker/ -race -count=6 -shuffle=on -timeout 15m 2>&1
        shell: bash -o pipefail {0}
