name: tw-gotest
on:
  push:
    branches: ['tw-ci/**']
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: devshard/go.mod
          cache: true
          cache-dependency-path: devshard/go.sum
      - name: go test devshard ./cmd/gateway ./cmd/gateway/config/... ./cmd/gateway/filters/... ./cmd/gateway/heights/... ./cmd/gateway/hostping/... ./cmd/gateway/journal/... ./cmd/gateway/metrics/... ./cmd/gateway/perf/... ./cmd/gateway/scenarios/... ./cmd/gateway/shadow/... ./cmd/gateway/warmup/... -race -count=2 -shuffle=on -timeout 35m
        if: always()
        working-directory: devshard
        run: go test ./cmd/gateway ./cmd/gateway/config/... ./cmd/gateway/filters/... ./cmd/gateway/heights/... ./cmd/gateway/hostping/... ./cmd/gateway/journal/... ./cmd/gateway/metrics/... ./cmd/gateway/perf/... ./cmd/gateway/scenarios/... ./cmd/gateway/shadow/... ./cmd/gateway/warmup/... -race -count=2 -shuffle=on -timeout 35m 2>&1
        shell: bash -o pipefail {0}
